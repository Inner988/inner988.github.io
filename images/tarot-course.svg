<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
<!-- 塔羅課程配圖（原創插畫）：深靛藍星空＋放射光芒＋三張牌卡；
     動態：光芒慢轉、光暈呼吸、牌框掃過一道金光、星芒閃爍、金粉往上飄 -->
<style>
  .rays { animation: spin 160s linear infinite; }
  .spin { animation: spin 110s linear infinite; }
  .spin-rev { animation: spin 170s linear infinite reverse; }
  .breathe { animation: breathe 7s ease-in-out infinite; }
  .breathe2 { animation: breathe 9s ease-in-out infinite -4s; }
  .float { animation: float 7s ease-in-out infinite; }
  .floatL { animation: float 8.5s ease-in-out infinite -2s; }
  .floatR { animation: float 9.5s ease-in-out infinite -5s; }
  .sp1 { animation: sparkle 3s ease-in-out infinite; }
  .sp2 { animation: sparkle 3.8s ease-in-out infinite 1s; }
  .sp3 { animation: sparkle 4.6s ease-in-out infinite 2.2s; }
  .sp4 { animation: sparkle 5.4s ease-in-out infinite .6s; }
  .tw1 { animation: tw 3.4s ease-in-out infinite; }
  .tw2 { animation: tw 4.4s ease-in-out infinite 1.3s; }
  .tw3 { animation: tw 5.2s ease-in-out infinite 2.6s; }
  .dust { animation: dust 9s linear infinite; }
  .d2 { animation-delay: -3s; } .d3 { animation-delay: -6s; } .d4 { animation-delay: -1.5s; } .d5 { animation-delay: -4.5s; } .d6 { animation-delay: -7.5s; }
  .core { animation: core 4s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes tw { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  @keyframes dust { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .6; } 100% { transform: translateY(-260px); opacity: 0; } }
  @keyframes core { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
  .sp1, .sp2, .sp3, .sp4 { transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: reduce) {
    .rays, .spin, .spin-rev, .breathe, .breathe2, .float, .floatL, .floatR, .sp1, .sp2, .sp3, .sp4, .tw1, .tw2, .tw3, .dust, .core { animation: none; }
    .sp1, .sp2, .sp3, .sp4 { opacity: .8; }
  }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171b38"/><stop offset=".5" stop-color="#241f46"/><stop offset="1" stop-color="#161630"/>
  </linearGradient>
  <radialGradient id="teal" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#36a8a2" stop-opacity=".55"/><stop offset="1" stop-color="#36a8a2" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rose" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#c8508a" stop-opacity=".5"/><stop offset="1" stop-color="#c8508a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="violet" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#7a5cc0" stop-opacity=".45"/><stop offset="1" stop-color="#7a5cc0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ffe2a0" stop-opacity=".85"/><stop offset=".35" stop-color="#f0bf62" stop-opacity=".32"/><stop offset="1" stop-color="#e2b45f" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ray" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="scale(470)">
    <stop offset="0" stop-color="#ffe2a0" stop-opacity=".5"/><stop offset=".6" stop-color="#f0bf62" stop-opacity=".12"/><stop offset="1" stop-color="#f0bf62" stop-opacity="0"/>
  </radialGradient>
  <!-- 用固定座標的漸層：細直線（寬或高為 0）用比例漸層會整條不顯示 -->
  <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="-320" y1="-320" x2="320" y2="320">
    <stop offset="0" stop-color="#fbe3a6"/><stop offset=".45" stop-color="#e2b45f"/><stop offset="1" stop-color="#a77b3a"/>
  </linearGradient>
  <!-- 牌框上掃過的一道亮光 -->
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e2b45f"/>
    <stop offset=".42" stop-color="#e2b45f"/>
    <stop offset=".5" stop-color="#fffbe9"/>
    <stop offset=".58" stop-color="#e2b45f"/>
    <stop offset="1" stop-color="#a77b3a"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 -1; 1 1; 1 1" keyTimes="0; .45; 1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#30306a"/><stop offset=".5" stop-color="#43306c"/><stop offset="1" stop-color="#1f3d5c"/>
  </linearGradient>
  <linearGradient id="cardSide" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a2a58"/><stop offset="1" stop-color="#233650"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".5"/></filter>
  <!-- 四角星芒 -->
  <path id="star4" d="M0 -14 C2 -3 3 -2 14 0 C3 2 2 3 0 14 C-2 3 -3 2 -14 0 C-3 -2 -2 -3 0 -14Z"/>
</defs>

<rect width="1200" height="900" fill="url(#bg)"/>
<ellipse cx="230" cy="220" rx="380" ry="280" fill="url(#teal)" class="breathe"/>
<ellipse cx="990" cy="700" rx="400" ry="280" fill="url(#rose)" class="breathe2"/>
<ellipse cx="1000" cy="160" rx="300" ry="220" fill="url(#violet)" class="breathe2"/>
<ellipse cx="200" cy="760" rx="300" ry="200" fill="url(#violet)" class="breathe"/>

<!-- 放射狀光芒（慢慢轉） -->
<g transform="translate(600 440)">
  <g class="rays" fill="url(#ray)">
    <path d="M0 0 L-14 -470 L14 -470Z"/><path d="M0 0 L-14 -470 L14 -470Z" transform="rotate(20)"/><path d="M0 0 L-8 -430 L8 -430Z" transform="rotate(40)"/>
    <path d="M0 0 L-14 -470 L14 -470Z" transform="rotate(60)"/><path d="M0 0 L-8 -430 L8 -430Z" transform="rotate(80)"/><path d="M0 0 L-14 -470 L14 -470Z" transform="rotate(100)"/>
    <path d="M0 0 L-8 -430 L8 -430Z" transform="rotate(120)"/><path d="M0 0 L-14 -470 L14 -470Z" transform="rotate(140)"/><path d="M0 0 L-8 -430 L8 -430Z" transform="rotate(160)"/>
    <path d="M0 0 L-14 -470 L14 -470Z" transform="rotate(180)"/><path d="M0 0 L-8 -430 L8 -430Z" transform="rotate(200)"/><path d="M0 0 L-14 -470 L14 -470Z" transform="rotate(220)"/>
    <path d="M0 0 L-8 -430 L8 -430Z" transform="rotate(240)"/><path d="M0 0 L-14 -470 L14 -470Z" transform="rotate(260)"/><path d="M0 0 L-8 -430 L8 -430Z" transform="rotate(280)"/>
    <path d="M0 0 L-14 -470 L14 -470Z" transform="rotate(300)"/><path d="M0 0 L-8 -430 L8 -430Z" transform="rotate(320)"/><path d="M0 0 L-14 -470 L14 -470Z" transform="rotate(340)"/>
  </g>
</g>
<circle cx="600" cy="440" r="380" fill="url(#halo)" class="breathe"/>

<!-- 小星點 -->
<g fill="#f6dc9c">
  <g class="tw1"><circle cx="120" cy="110" r="2.4"/><circle cx="1080" cy="120" r="2.2"/><circle cx="140" cy="760" r="2"/><circle cx="700" cy="50" r="1.6"/><circle cx="40" cy="300" r="1.6"/><circle cx="1160" cy="560" r="1.8"/></g>
  <g class="tw2"><circle cx="300" cy="70" r="1.8"/><circle cx="1130" cy="400" r="2"/><circle cx="1050" cy="820" r="2.2"/><circle cx="60" cy="460" r="1.6"/><circle cx="480" cy="860" r="1.6"/></g>
  <g class="tw3"><circle cx="380" cy="190" r="1.8"/><circle cx="930" cy="80" r="1.8"/><circle cx="320" cy="840" r="1.8"/><circle cx="860" cy="860" r="1.6"/><circle cx="820" cy="180" r="1.4"/></g>
</g>
<!-- 星座連線 -->
<g fill="none" stroke="#f6dc9c" stroke-width="1" opacity=".3">
  <polyline points="120,110 300,70 380,190"/><polyline points="1080,120 930,80 820,180"/><polyline points="140,760 320,840 480,860"/><polyline points="1160,560 1130,400"/>
</g>
<!-- 左上小彎月 -->
<g transform="translate(170 180)" filter="url(#glow)" class="tw2">
  <path d="M14 -26 A30 30 0 1 0 14 26 A23 23 0 1 1 14 -26Z" fill="#f6dc9c"/>
</g>

<!-- 後方幾何：圓環＋刻度（慢轉）、雙色三角（反轉） -->
<g transform="translate(600 440)">
  <g class="spin" fill="none" stroke="url(#gold)" opacity=".6">
    <circle r="350" stroke-width="1"/>
    <circle r="312" stroke-width="1.5"/>
    <circle r="296" stroke-width="1" stroke-dasharray="2 9"/>
    <g stroke-width="1.2">
      <line y1="-312" y2="-350"/><line y1="-312" y2="-350" transform="rotate(30)"/><line y1="-312" y2="-350" transform="rotate(60)"/>
      <line y1="-312" y2="-350" transform="rotate(90)"/><line y1="-312" y2="-350" transform="rotate(120)"/><line y1="-312" y2="-350" transform="rotate(150)"/>
      <line y1="-312" y2="-350" transform="rotate(180)"/><line y1="-312" y2="-350" transform="rotate(210)"/><line y1="-312" y2="-350" transform="rotate(240)"/>
      <line y1="-312" y2="-350" transform="rotate(270)"/><line y1="-312" y2="-350" transform="rotate(300)"/><line y1="-312" y2="-350" transform="rotate(330)"/>
    </g>
    <g fill="#f6dc9c" stroke="none">
      <circle cy="-331" r="3.2" transform="rotate(15)"/><circle cy="-331" r="2.2" transform="rotate(45)"/><circle cy="-331" r="3.2" transform="rotate(75)"/>
      <circle cy="-331" r="2.2" transform="rotate(105)"/><circle cy="-331" r="3.2" transform="rotate(135)"/><circle cy="-331" r="2.2" transform="rotate(165)"/>
      <circle cy="-331" r="3.2" transform="rotate(195)"/><circle cy="-331" r="2.2" transform="rotate(225)"/><circle cy="-331" r="3.2" transform="rotate(255)"/>
      <circle cy="-331" r="2.2" transform="rotate(285)"/><circle cy="-331" r="3.2" transform="rotate(315)"/><circle cy="-331" r="2.2" transform="rotate(345)"/>
    </g>
  </g>
  <g class="spin-rev" fill="none" stroke-width="1.4" opacity=".6">
    <polygon points="0,-290 251,145 -251,145" stroke="#36a8a2"/>
    <polygon points="0,290 251,-145 -251,-145" stroke="#c8508a"/>
  </g>
</g>

<!-- 左牌：月相與水波 -->
<g transform="translate(405 470) rotate(-13)">
  <g class="floatL" filter="url(#shadow)">
    <rect x="-112" y="-188" width="224" height="376" rx="14" fill="url(#cardSide)" stroke="url(#gold)" stroke-width="2.4"/>
    <rect x="-99" y="-175" width="198" height="350" rx="9" fill="none" stroke="url(#gold)" stroke-width="1" opacity=".6"/>
    <g transform="translate(0 -88)" filter="url(#glow)">
      <circle r="34" fill="#f6dc9c" opacity=".95"/>
      <path d="M-68 0 A10 10 0 1 0 -68 .1" fill="none" stroke="#f6dc9c" stroke-width="1.6"/>
      <path d="M-52 -10 A12 12 0 1 1 -52 10 A9 12 0 1 0 -52 -10Z" fill="#f6dc9c" opacity=".8"/>
      <path d="M52 -10 A12 12 0 1 0 52 10 A9 12 0 1 1 52 -10Z" fill="#f6dc9c" opacity=".8"/>
    </g>
    <g fill="none" stroke="#36a8a2" stroke-width="2" opacity=".95">
      <path d="M-70 40 Q-35 10 0 40 T70 40"/><path d="M-70 72 Q-35 42 0 72 T70 72"/><path d="M-70 104 Q-35 74 0 104 T70 104"/>
    </g>
    <g fill="url(#gold)"><circle cy="-175" r="3.5"/><circle cy="175" r="3.5"/></g>
  </g>
</g>

<!-- 右牌：星芒菱形 -->
<g transform="translate(795 470) rotate(13)">
  <g class="floatR" filter="url(#shadow)">
    <rect x="-112" y="-188" width="224" height="376" rx="14" fill="url(#cardSide)" stroke="url(#gold)" stroke-width="2.4"/>
    <rect x="-99" y="-175" width="198" height="350" rx="9" fill="none" stroke="url(#gold)" stroke-width="1" opacity=".6"/>
    <g fill="none" stroke="#c8508a" stroke-width="2" opacity=".95">
      <path d="M0 -120 L64 -20 L0 80 L-64 -20Z"/><path d="M0 -84 L40 -20 L0 44 L-40 -20Z"/>
    </g>
    <g filter="url(#glow)" fill="#f6dc9c"><use href="#star4" transform="translate(0 -20) scale(1.3)"/></g>
    <g fill="none" stroke="url(#gold)" stroke-width="1.4"><line x1="-70" y1="122" x2="70" y2="122"/><line x1="-46" y1="140" x2="46" y2="140" opacity=".7"/></g>
    <g fill="url(#gold)"><circle cy="-175" r="3.5"/><circle cy="175" r="3.5"/></g>
  </g>
</g>

<!-- 主牌：幾何玫瑰（最前面） -->
<g transform="translate(600 430)">
  <g class="float" filter="url(#shadow)">
    <!-- 牌後面的柔光 -->
    <rect x="-140" y="-225" width="280" height="450" rx="22" fill="#f0bf62" opacity=".35" filter="url(#softglow)" class="breathe"/>
    <rect x="-128" y="-214" width="256" height="428" rx="16" fill="url(#card)" stroke="url(#shine)" stroke-width="3.6"/>
    <rect x="-113" y="-199" width="226" height="398" rx="10" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity=".75"/>
    <!-- 四角小星 -->
    <g fill="url(#gold)">
      <use href="#star4" transform="translate(-95 -181) scale(.5)"/><use href="#star4" transform="translate(95 -181) scale(.5)"/>
      <use href="#star4" transform="translate(-95 181) scale(.5)"/><use href="#star4" transform="translate(95 181) scale(.5)"/>
    </g>
    <g transform="translate(0 -32)">
      <circle r="110" fill="url(#halo)" class="core"/>
      <!-- 外圈點點慢慢轉 -->
      <g class="spin" fill="#f6dc9c" opacity=".85">
        <circle cy="-90" r="2.4"/><circle cy="-90" r="1.6" transform="rotate(30)"/><circle cy="-90" r="2.4" transform="rotate(60)"/>
        <circle cy="-90" r="1.6" transform="rotate(90)"/><circle cy="-90" r="2.4" transform="rotate(120)"/><circle cy="-90" r="1.6" transform="rotate(150)"/>
        <circle cy="-90" r="2.4" transform="rotate(180)"/><circle cy="-90" r="1.6" transform="rotate(210)"/><circle cy="-90" r="2.4" transform="rotate(240)"/>
        <circle cy="-90" r="1.6" transform="rotate(270)"/><circle cy="-90" r="2.4" transform="rotate(300)"/><circle cy="-90" r="1.6" transform="rotate(330)"/>
      </g>
      <g fill="none" stroke="url(#gold)" stroke-width="1.8">
        <circle r="72"/>
        <path d="M0 -72 C31 -31 31 31 0 72 C-31 31 -31 -31 0 -72Z"/>
        <path d="M-72 0 C-31 -31 31 -31 72 0 C31 31 -31 31 -72 0Z"/>
        <path d="M0 -72 C31 -31 31 31 0 72 C-31 31 -31 -31 0 -72Z" transform="rotate(45)"/>
        <path d="M0 -72 C31 -31 31 31 0 72 C-31 31 -31 -31 0 -72Z" transform="rotate(-45)"/>
      </g>
      <g filter="url(#glow)">
        <circle r="18" fill="#ffe7ad" class="core"/>
        <circle r="7" fill="#fffbe9"/>
        <g fill="#36a8a2"><circle cy="-72" r="5.5"/><circle cy="72" r="5.5"/></g>
        <g fill="#c8508a"><circle cx="-72" r="5.5"/><circle cx="72" r="5.5"/></g>
      </g>
    </g>
    <g fill="none" stroke="url(#gold)" stroke-width="1.4" opacity=".9">
      <path d="M-84 116 L84 116"/><path d="M-60 136 L60 136" opacity=".7"/>
    </g>
    <path d="M0 102 L11 120 L0 138 L-11 120Z" fill="#f6dc9c" filter="url(#glow)"/>
    <text y="184" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="7" fill="#f6dc9c">TAROT</text>
  </g>
</g>

<!-- 閃爍的大星芒 -->
<g fill="#fff1c8" filter="url(#glow)">
  <g transform="translate(300 300) scale(1.1)"><use href="#star4" class="sp1"/></g>
  <g transform="translate(905 255) scale(1.4)"><use href="#star4" class="sp2"/></g>
  <g transform="translate(940 640) scale(.9)"><use href="#star4" class="sp3"/></g>
  <g transform="translate(255 600) scale(1.2)"><use href="#star4" class="sp4"/></g>
  <g transform="translate(600 70) scale(.9)"><use href="#star4" class="sp2"/></g>
  <g transform="translate(1080 470) scale(.8)"><use href="#star4" class="sp1"/></g>
</g>

<!-- 往上飄的金粉 -->
<g fill="#f6dc9c">
  <circle class="dust" cx="470" cy="780" r="2.2"/>
  <circle class="dust d2" cx="540" cy="820" r="1.6"/>
  <circle class="dust d3" cx="660" cy="800" r="2"/>
  <circle class="dust d4" cx="730" cy="830" r="1.6"/>
  <circle class="dust d5" cx="600" cy="850" r="2.4"/>
  <circle class="dust d6" cx="420" cy="840" r="1.4"/>
  <circle class="dust d3" cx="790" cy="780" r="1.8"/>
</g>
</svg>
