<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e9e3d0"/><stop offset=".35" stop-color="#f4dfba"/><stop offset=".6" stop-color="#eec493"/><stop offset="1" stop-color="#d9a877"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff6df" stop-opacity=".95"/><stop offset=".3" stop-color="#ffe7b8" stop-opacity=".5"/><stop offset="1" stop-color="#ffe7b8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbf3e4" stop-opacity="0"/><stop offset=".5" stop-color="#fbf3e4" stop-opacity=".55"/><stop offset="1" stop-color="#fbf3e4" stop-opacity="0"/>
  </linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .07 0"/></filter>
</defs>

<rect width="800" height="1000" fill="url(#sky)"/>
<circle cx="400" cy="520" r="330" fill="url(#sunGlow)"/>
<g fill="none" stroke="#fff" stroke-opacity=".35">
  <circle cx="400" cy="520" r="120"/><circle cx="400" cy="520" r="175" stroke-opacity=".22"/><circle cx="400" cy="520" r="240" stroke-opacity=".12"/>
</g>
<circle cx="400" cy="520" r="64" fill="#fff8e8"/>

<!-- 飛鳥 -->
<g fill="none" stroke="#5a4a38" stroke-width="2" stroke-linecap="round" opacity=".55">
  <path d="M250 300 q8 -8 16 0 q8 -8 16 0"/><path d="M300 270 q6 -6 12 0 q6 -6 12 0"/><path d="M560 330 q5 -5 10 0 q5 -5 10 0"/>
</g>

<!-- 山巒（由遠到近） -->
<path d="M0 600 Q80 540 170 570 Q260 520 340 560 Q420 500 510 545 Q600 505 690 550 Q750 530 800 545 V1000 H0Z" fill="#cdbf9d" opacity=".85"/>
<rect y="540" width="800" height="90" fill="url(#mist)"/>
<path d="M0 660 Q110 585 230 630 Q330 590 430 640 Q560 575 680 625 Q750 600 800 615 V1000 H0Z" fill="#a8a986"/>
<rect y="610" width="800" height="90" fill="url(#mist)" opacity=".8"/>
<path d="M0 745 Q140 660 300 715 Q420 680 520 720 Q650 665 800 705 V1000 H0Z" fill="#7d8665"/>
<rect y="700" width="800" height="80" fill="url(#mist)" opacity=".6"/>
<path d="M0 835 Q180 745 380 805 Q560 760 800 800 V1000 H0Z" fill="#545d45"/>
<path d="M0 925 Q240 860 480 900 Q650 875 800 890 V1000 H0Z" fill="#323a2c"/>

<!-- 前景草 -->
<g stroke="#232a1f" stroke-width="2.4" stroke-linecap="round" fill="none">
  <path d="M60 1000 q4 -40 -6 -70"/><path d="M72 1000 q2 -50 14 -84"/><path d="M84 1000 q-2 -36 -16 -58"/>
  <path d="M700 1000 q4 -46 -8 -80"/><path d="M712 1000 q0 -56 16 -90"/><path d="M724 1000 q-4 -32 -18 -50"/><path d="M736 1000 q6 -40 20 -62"/>
</g>
<rect width="800" height="1000" filter="url(#grain)"/>
</svg>
