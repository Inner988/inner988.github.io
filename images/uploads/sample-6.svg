<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#efe5d6"/><stop offset="1" stop-color="#ddccb2"/>
  </linearGradient>
  <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b9a07e"/><stop offset="1" stop-color="#8e7656"/>
  </linearGradient>
  <radialGradient id="stoneA" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#c9c3b6"/><stop offset="1" stop-color="#6f6a60"/></radialGradient>
  <radialGradient id="stoneB" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#bba98f"/><stop offset="1" stop-color="#6e5d47"/></radialGradient>
  <radialGradient id="stoneC" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#9da095"/><stop offset="1" stop-color="#4c5049"/></radialGradient>
  <linearGradient id="candle" x1="0" x2="1">
    <stop offset="0" stop-color="#e6dccb"/><stop offset=".4" stop-color="#fffaf0"/><stop offset="1" stop-color="#d4c7b2"/>
  </linearGradient>
  <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ffd27a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3c4"/><stop offset=".6" stop-color="#ffb648"/><stop offset="1" stop-color="#e0702a"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .07 0"/></filter>
</defs>

<rect width="800" height="700" fill="url(#wall)"/>
<circle cx="560" cy="300" r="230" fill="url(#flameGlow)" opacity=".6"/>
<rect y="520" width="800" height="180" fill="url(#table)"/>
<rect y="520" width="800" height="2" fill="#fff" opacity=".35"/>

<!-- 尤加利葉 -->
<g>
  <path d="M120 520 C150 420 170 330 240 220" stroke="#7d8a6c" stroke-width="3" fill="none"/>
  <g fill="#9fae8f">
    <ellipse cx="140" cy="470" rx="22" ry="16" transform="rotate(-20 140 470)"/>
    <ellipse cx="170" cy="440" rx="22" ry="16" transform="rotate(20 170 440)"/>
    <ellipse cx="160" cy="390" rx="20" ry="15" transform="rotate(-25 160 390)"/>
    <ellipse cx="192" cy="360" rx="20" ry="14" transform="rotate(25 192 360)"/>
    <ellipse cx="190" cy="310" rx="18" ry="13" transform="rotate(-30 190 310)"/>
    <ellipse cx="220" cy="285" rx="17" ry="12" transform="rotate(30 220 285)"/>
    <ellipse cx="228" cy="240" rx="14" ry="10"/>
  </g>
  <g fill="#c6d0b8" opacity=".5">
    <ellipse cx="135" cy="466" rx="10" ry="6" transform="rotate(-20 135 466)"/><ellipse cx="166" cy="436" rx="10" ry="6" transform="rotate(20 166 436)"/>
    <ellipse cx="156" cy="386" rx="9" ry="5" transform="rotate(-25 156 386)"/><ellipse cx="188" cy="356" rx="9" ry="5" transform="rotate(25 188 356)"/>
  </g>
</g>

<!-- 疊石 -->
<ellipse cx="370" cy="530" rx="140" ry="14" fill="#4a3a28" opacity=".4" filter="url(#blur)"/>
<ellipse cx="370" cy="490" rx="120" ry="42" fill="url(#stoneC)"/>
<ellipse cx="365" cy="425" rx="95" ry="34" fill="url(#stoneB)" transform="rotate(-4 365 425)"/>
<ellipse cx="375" cy="370" rx="72" ry="27" fill="url(#stoneA)" transform="rotate(5 375 370)"/>
<ellipse cx="368" cy="325" rx="52" ry="21" fill="url(#stoneB)" transform="rotate(-6 368 325)"/>
<ellipse cx="372" cy="290" rx="34" ry="15" fill="url(#stoneC)" transform="rotate(4 372 290)"/>

<!-- 蠟燭 -->
<ellipse cx="580" cy="532" rx="70" ry="10" fill="#4a3a28" opacity=".35" filter="url(#blur)"/>
<rect x="525" y="390" width="110" height="140" rx="6" fill="url(#candle)"/>
<ellipse cx="580" cy="390" rx="55" ry="10" fill="#f3ead9"/>
<ellipse cx="580" cy="391" rx="44" ry="7" fill="#e6dac4"/>
<line x1="580" y1="390" x2="580" y2="372" stroke="#3a2a1c" stroke-width="2"/>
<circle cx="580" cy="350" r="60" fill="url(#flameGlow)"/>
<path d="M580 318 C590 336 594 352 588 364 C584 372 576 372 572 364 C566 352 570 336 580 318Z" fill="url(#flame)"/>

<rect width="800" height="700" filter="url(#grain)"/>
</svg>
