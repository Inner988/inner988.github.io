<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 800">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7efe3"/><stop offset="1" stop-color="#e8dac4"/>
  </linearGradient>
  <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c9a77c"/><stop offset="1" stop-color="#9c7a52"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" x2="1">
    <stop offset="0" stop-color="#4a3216"/><stop offset=".2" stop-color="#9a6e33"/><stop offset=".34" stop-color="#f0d394"/>
    <stop offset=".45" stop-color="#c8994f"/><stop offset=".75" stop-color="#7f5628"/><stop offset="1" stop-color="#3a2410"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" x2="1">
    <stop offset="0" stop-color="#7a5224"/><stop offset=".35" stop-color="#fff0c4"/><stop offset=".6" stop-color="#c99a4e"/><stop offset="1" stop-color="#6a441c"/>
  </linearGradient>
  <radialGradient id="inner" cx="50%" cy="85%" r="75%">
    <stop offset="0" stop-color="#e3b86a"/><stop offset=".6" stop-color="#7f5628"/><stop offset="1" stop-color="#3a2410"/>
  </radialGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/>
  </linearGradient>
  <g id="bowl">
    <path d="M-100 0 C-100 52 -60 80 0 80 C60 80 100 52 100 0Z" fill="url(#metal)"/>
    <path d="M-100 0 C-100 52 -60 80 0 80 C60 80 100 52 100 0Z" fill="url(#shade)"/>
    <ellipse cx="-36" cy="34" rx="6" ry="28" fill="#fff8e0" opacity=".3" transform="rotate(-14 -36 34)"/>
    <ellipse cx="0" cy="0" rx="100" ry="18" fill="url(#rim)"/>
    <ellipse cx="0" cy="1.5" rx="93" ry="14.5" fill="url(#inner)"/>
  </g>
  <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="big"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .07 0"/></filter>
</defs>

<rect width="800" height="800" fill="url(#wall)"/>
<!-- 窗光與葉影 -->
<polygon points="460,0 800,0 800,420 600,520" fill="#fffaf0" opacity=".55" filter="url(#big)"/>
<g fill="#6f6250" opacity=".09" filter="url(#blur)">
  <ellipse cx="150" cy="140" rx="70" ry="22" transform="rotate(-30 150 140)"/>
  <ellipse cx="220" cy="210" rx="80" ry="24" transform="rotate(20 220 210)"/>
  <ellipse cx="110" cy="260" rx="60" ry="20" transform="rotate(-50 110 260)"/>
  <ellipse cx="260" cy="110" rx="55" ry="18" transform="rotate(40 260 110)"/>
  <path d="M60 60 Q200 200 300 380" stroke="#6f6250" stroke-width="6" fill="none"/>
</g>

<!-- 桌面 -->
<rect y="580" width="800" height="220" fill="url(#table)"/>
<rect y="580" width="800" height="3" fill="#fff" opacity=".35"/>
<g stroke="#7c5c38" stroke-opacity=".18" fill="none">
  <path d="M0 640 Q300 630 800 650"/><path d="M0 700 Q400 690 800 712"/><path d="M0 760 Q350 752 800 770"/>
</g>

<!-- 陰影 -->
<ellipse cx="470" cy="606" rx="160" ry="16" fill="#3a2410" opacity=".45" filter="url(#blur)"/>
<ellipse cx="250" cy="636" rx="125" ry="14" fill="#3a2410" opacity=".45" filter="url(#blur)"/>
<ellipse cx="640" cy="642" rx="95" ry="12" fill="#3a2410" opacity=".45" filter="url(#blur)"/>

<!-- 三只頌缽 -->
<use href="#bowl" xlink:href="#bowl" transform="translate(470 480) scale(1.5)"/>
<use href="#bowl" xlink:href="#bowl" transform="translate(250 538) scale(1.15)"/>
<use href="#bowl" xlink:href="#bowl" transform="translate(640 572) scale(.85)"/>

<!-- 缽棒 -->
<g transform="rotate(8 400 700)">
  <rect x="280" y="692" width="260" height="15" rx="7.5" fill="#8a5a2e"/>
  <rect x="280" y="692" width="260" height="5" rx="2.5" fill="#d6a874" opacity=".7"/>
  <rect x="280" y="690" width="60" height="19" rx="9" fill="#5e4636"/>
</g>
<rect width="800" height="800" filter="url(#grain)"/>
</svg>
