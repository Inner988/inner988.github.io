# 網站後台設定
# ★ 只需要修改下面「repo」這一行：改成「GitHub 帳號名稱/儲存庫名稱」
backend:
  name: github
  repo: Inner988/inner988.github.io
  branch: main

# 上傳的相片會存到這個資料夾
media_folder: images/uploads
public_folder: /images/uploads

collections:
  # ───────── 最新活動 ─────────
  - name: events
    label: 最新活動
    files:
      - name: events
        label: 活動列表（拖曳或用 ⋯ 選單上移／下移調整順序；全部刪除後首頁會自動隱藏這個區塊）
        file: content/events.json
        format: json
        fields:
          - name: items
            label: 活動
            label_singular: 活動
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: 活動名稱, widget: string }
              - { name: tag, label: 小標籤（可不填）, widget: string, required: false, hint: "例：招生中、名額有限" }
              - { name: image, label: 活動海報或照片, widget: image, required: false, hint: "海報會完整顯示，不會被裁切" }
              - { name: date, label: 日期, widget: string, required: false }
              - { name: time, label: 時間, widget: string, required: false }
              - { name: location, label: 地點, widget: string, required: false }
              - { name: description, label: 活動說明, widget: markdown, required: false }
              - { name: link, label: 報名連結（可不填）, widget: string, required: false, hint: "空白：不顯示按鈕。填 Google 表單等網址：只顯示一顆報名按鈕。填 https://m.me/rekibowl988：顯示「LINE 報名」和「Messenger 報名」" }
              - { name: linkText, label: 表單按鈕文字（可不填）, widget: string, required: false, hint: "報名連結是 Google 表單等網址時使用，沒填就顯示「線上報名」" }
              - { name: show, label: 顯示在網站上, widget: boolean, default: true }

  # ───────── 課程 ─────────
  - name: courses
    label: 課程活動
    files:
      - name: courses
        label: 課程列表（拖曳可調整順序）
        file: content/courses.json
        format: json
        fields:
          - name: items
            label: 課程
            label_singular: 課程
            widget: list
            summary: "{{fields.status}}｜{{fields.title}}"
            fields:
              - { name: title, label: 課程名稱, widget: string }
              - name: category
                label: 分類
                widget: select
                options: [頌缽, 大地靈氣, 個案, 塔羅, 其他]
                default: 頌缽
              - name: status
                label: 狀態
                widget: select
                options: [招生中, 即將開課, 已額滿, 已結束]
                default: 招生中
              - { name: image, label: 課程照片, widget: image, required: false }
              # 同一個課程開在不同日期、時間、地點時，在這裡多加一個場次就好，不用另外新增課程
              - name: sessions
                label: 上課場次（同一課程不同日期／時間／地點，都加在這裡）
                label_singular: 場次
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.date}}｜{{fields.time}}｜{{fields.location}}"
                fields:
                  - { name: date, label: 日期, widget: string, required: false, hint: "例：2026/11/15（六）–16（日），或「預約制」「日期未定」" }
                  - { name: time, label: 時間, widget: string, required: false, hint: "例：10:00 – 17:00" }
                  - { name: location, label: 地點, widget: string, required: false, hint: "例：台北（實體）、線上" }
                  - name: status
                    label: 這個場次的狀態（可不填）
                    widget: select
                    required: false
                    options: [已額滿, 已結束]
                    hint: "只有這一場額滿或結束時才選；整個課程的狀態請用上面的「狀態」"
              - { name: duration, label: 時長, widget: string, required: false, hint: "例：兩天、一天（7.5 小時）" }
              - { name: summary, label: 一句話簡介（顯示在課程卡片上，可不填）, widget: string, required: false }
              - { name: price, label: 原價（點開課程才看得到）, widget: string, required: false, hint: "例：NT$ 3,600" }
              - { name: earlyPrice, label: 早鳥價（沒有可不填）, widget: string, required: false, hint: "例：NT$ 3,200。有填時，網站會把原價加上刪除線" }
              - { name: earlyDeadline, label: 早鳥優惠截止日（可不填）, widget: string, required: false, hint: "例：11/1（六）" }
              - { name: description, label: 課程詳細介紹（點開課程才看得到）, widget: markdown, required: false }
              - { name: note, label: 備註（可不填）, widget: markdown, required: false, hint: "顯示在課程視窗的費用下方。例：請自備頌缽、可分期、需先完成初階…" }
              - { name: link, label: 報名表單網址（可不填）, widget: string, required: false, hint: "沒填時顯示「LINE 報名」和「Messenger 報名」；填了 Google 表單等網址，就只顯示一顆「線上報名」" }
              - { name: show, label: 顯示在網站上, widget: boolean, default: true }

  # ───────── 靈魂藍圖 ─────────
  - name: soul
    label: 靈魂藍圖
    files:
      - name: soul
        label: 靈魂藍圖介紹
        file: content/soul.json
        format: json
        fields:
          - { name: show, label: 顯示在網站上（關閉時整個區塊隱藏）, widget: boolean, default: true }
          - { name: title, label: 標題, widget: string }
          - { name: subtitle, label: 副標題, widget: string, required: false }
          - name: theme
            label: 區塊風格
            widget: select
            default: site
            options:
              - { label: 統一風格（和頌缽、大地靈氣同色系）, value: site }
              - { label: 溫暖淡雅, value: warm }
              - { label: 夢幻星空, value: dreamy }
              - { label: 神秘高雅, value: mystic }
              - { label: 清新自然, value: fresh }
          - { name: image, label: 配圖（淺色風格用）, widget: image, required: false }
          - { name: imageDark, label: 夜空版配圖（夢幻星空、神秘高雅用；沒放就用上面那張）, widget: image, required: false }
          - { name: intro, label: 介紹文字, widget: markdown, required: false }
          - name: aspects
            label: 你可以從解讀中了解（小卡片）
            widget: list
            required: false
            fields:
              - { name: title, label: 標題, widget: string }
              - { name: text, label: 說明, widget: string }
          - name: suitable
            label: 特別適合這樣的你
            widget: list
            required: false
            field: { name: item, label: 項目, widget: string }
          - name: steps
            label: 解讀方式（步驟）
            widget: list
            required: false
            fields:
              - { name: title, label: 步驟名稱, widget: string }
              - { name: text, label: 說明, widget: string }
          - { name: combo, label: 可一起預約的解讀（醒目提示的一句話）, widget: markdown, required: false, hint: "顯示在「解讀方式」下方。用 **兩邊星號** 包起來的字會變色，例：可與**塔羅解讀**、**靈魂能量解讀**一起預約" }
          - { name: note, label: 最下方的小提醒, widget: string, required: false }

  # ───────── 塔羅 ─────────
  - name: tarot
    label: 塔羅
    files:
      - name: tarot
        label: 塔羅介紹
        file: content/tarot.json
        format: json
        fields:
          - { name: show, label: 顯示在網站上（關閉時整個區塊隱藏）, widget: boolean, default: true }
          - { name: title, label: 標題, widget: string }
          - { name: lead, label: 一句引言（標題下方）, widget: string, required: false }
          - { name: image, label: 配圖, widget: image, required: false, hint: "可換成老師自己拍的牌卡或上課照片" }
          - { name: intro, label: 介紹文字, widget: markdown, required: false, hint: "用 **兩邊星號** 包起來的字會變粗體" }
          - name: benefits
            label: 塔羅能帶給你（小卡片）
            widget: list
            required: false
            fields:
              - { name: title, label: 標題, widget: string }
              - { name: text, label: 說明, widget: string }
          - name: offers
            label: 服務項目（深色小卡）
            widget: list
            required: false
            fields:
              - { name: title, label: 標題, widget: string }
              - { name: text, label: 說明, widget: markdown }
              - { name: button, label: 按鈕文字（可不填）, widget: string, required: false }
              - name: category
                label: 按鈕跳到哪一類課程
                widget: select
                default: 塔羅
                options:
                  - { label: 塔羅課程, value: 塔羅 }
                  - { label: 一對一陪伴（含靈魂藍圖・塔羅解讀）, value: 個案 }
                  - { label: 全部課程, value: all }

  # ───────── 服務小卡（頌缽、大地靈氣、靈魂藍圖介紹裡的深色小卡）─────────
  - name: offers
    label: 服務小卡
    files:
      - name: offers
        label: 各介紹區塊的服務小卡（塔羅的小卡在「塔羅」裡）
        file: content/offers.json
        format: json
        fields:
          - name: bowl
            label: 頌缽音療
            label_singular: 小卡
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields: &offerFields
              - { name: title, label: 標題, widget: string }
              - { name: text, label: 說明, widget: markdown, hint: "用 **兩邊星號** 包起來的字會變白色粗體" }
              - { name: button, label: 按鈕文字（可不填）, widget: string, required: false }
              - name: target
                label: 按鈕跳到哪裡
                widget: select
                default: 個案
                options:
                  - { label: 頌缽課程, value: 頌缽 }
                  - { label: 大地靈氣課程, value: 大地靈氣 }
                  - { label: 一對一陪伴（含靈魂藍圖・塔羅解讀）, value: 個案 }
                  - { label: 塔羅課程, value: 塔羅 }
                  - { label: 全部課程, value: all }
                  - { label: 塔羅介紹區塊, value: "#tarot" }
                  - { label: 靈魂藍圖介紹區塊, value: "#soul" }
                  - { label: 預約聯絡, value: "#contact" }
          - { name: reiki, label: 大地靈氣, label_singular: 小卡, widget: list, required: false, summary: "{{fields.title}}", fields: *offerFields }
          - { name: soul, label: 靈魂藍圖, label_singular: 小卡, widget: list, required: false, summary: "{{fields.title}}", fields: *offerFields }

  # ───────── 購物商城 ─────────
  - name: shop
    label: 購物商城
    files:
      - name: products
        label: 商品（全部刪除或都不顯示時，首頁會自動隱藏商城）
        file: content/shop.json
        format: json
        fields:
          - name: items
            label: 商品
            label_singular: 商品
            widget: list
            required: false
            summary: "{{fields.status}}｜{{fields.name}}｜{{fields.price}}"
            fields:
              - { name: name, label: 商品名稱, widget: string }
              - name: status
                label: 狀態
                widget: select
                options: [現貨, 預購, 售完]
                default: 現貨
              - { name: image, label: 主要相片, widget: image, required: false }
              - name: images
                label: 更多相片（可不放）
                widget: list
                required: false
                field: { name: image, label: 相片, widget: image }
              - { name: price, label: 售價（數字）, widget: number, value_type: int, hint: "只填數字，例：3800" }
              - { name: salePrice, label: 特價（沒有可不填）, widget: number, value_type: int, required: false, hint: "有填時，網站會顯示特價並把售價加上刪除線" }
              - { name: summary, label: 簡短介紹（商品卡片上顯示）, widget: text, required: false }
              - { name: description, label: 詳細介紹, widget: markdown, required: false }
              - { name: show, label: 上架（顯示在網站上）, widget: boolean, default: true }
      - name: settings
        label: 付款與運費設定
        file: content/shop-settings.json
        format: json
        fields:
          - { name: intro, label: 商城副標題, widget: string, required: false }
          - { name: bankName, label: 銀行名稱, widget: string, required: false, hint: "例：台灣銀行" }
          - { name: bankCode, label: 銀行代碼, widget: string, required: false, hint: "例：004" }
          - { name: bankBranch, label: 分行, widget: string, required: false }
          - { name: accountName, label: 戶名, widget: string, required: false }
          - { name: accountNumber, label: 帳號, widget: string, required: false, hint: "沒填的話，結帳後會顯示「匯款帳號請私訊老師索取」" }
          - { name: payDays, label: 幾天內完成匯款, widget: string, required: false, default: "3" }
          - { name: shippingFee, label: 宅配運費（數字）, widget: number, value_type: int, required: false }
          - { name: freeShippingOver, label: 滿多少免運（數字，0 代表不提供）, widget: number, value_type: int, required: false }
          - { name: allowPickup, label: 提供面交自取, widget: boolean, default: true }
          - { name: pickupNote, label: 面交說明, widget: string, required: false }
          - { name: lineUrl, label: LINE 連結（訂單傳送用）, widget: string, required: false }
          - { name: messengerUrl, label: Messenger 連結（訂單傳送用）, widget: string, required: false }
          - { name: email, label: 接收訂單的 Email（可不填）, widget: string, required: false }
          - { name: orderNote, label: 結帳完成頁的補充說明（可不填）, widget: text, required: false }

  # ───────── 療癒分享（學員心得）─────────
  - name: stories
    label: 療癒分享（學員心得）
    files:
      - name: stories
        label: 學員心得
        file: content/stories.json
        format: json
        fields:
          - name: items
            label: 心得
            label_singular: 心得
            widget: list
            summary: "{{fields.date}}｜{{fields.student}}｜{{fields.title}}"
            fields:
              - { name: title, label: 標題, widget: string }
              - { name: student, label: 學員／個案稱呼（可不填）, widget: string, required: false, hint: "例：護理師・頌缽初階學員、貓咪家長。沒填時網站顯示「學員」" }
              - name: category
                label: 分類
                widget: select
                hint: "上過課的學員選「學員課後分享」；沒上課、直接來找老師的選「一對一個案體驗」；跟毛孩有關的（不論學員或個案）都選「毛孩的故事」"
                options:
                  - { label: 學員課後分享｜頌缽, value: 頌缽 }
                  - { label: 學員課後分享｜大地靈氣, value: 大地靈氣 }
                  - { label: 學員課後分享｜靈魂藍圖, value: 靈魂藍圖 }
                  - { label: 學員課後分享｜塔羅, value: 塔羅 }
                  - { label: 一對一個案體驗, value: 個案 }
                  - { label: 毛孩的故事（學員或個案的毛孩都選這個）, value: 寵物 }
                default: 頌缽
              - { name: course, label: 上過的課程／體驗的服務（可不填）, widget: string, required: false, hint: "例：大地靈氣初階班、頌缽一對一、遠距大地靈氣。會顯示在卡片的小標籤上" }
              - { name: date, label: 日期（可不填）, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false, hint: "沒填日期的文章會排在列表最後面" }
              - { name: quote, label: 一句話引言（卡片上的大字）, widget: string, required: false }
              - { name: summary, label: 摘要（卡片上的小字）, widget: text, required: false }
              - { name: body, label: 完整心得, widget: markdown, required: false }
              - { name: photo, label: 相片（可不放）, widget: image, required: false }
              # 影片二擇一：貼 YouTube／臉書網址（最推薦），或直接上傳短片
              - { name: video, label: 影片網址（可不填）, widget: string, required: false, hint: "貼 YouTube 或臉書影片／Reels 的網址。比較長的影片請用這個" }
              - name: videoFile
                label: 或直接上傳影片（可不放）
                widget: file
                required: false
                accept: "video/mp4,video/webm,.mp4,.webm,.mov"
                media_libraries:
                  default:
                    config:
                      max_file_size: 15728640
                hint: "最大 15MB（約 20～30 秒的短片），mp4 最好。超過或儲存失敗，請改放 YouTube 再貼網址"
              - { name: link, label: 原文連結（可不填）, widget: string, required: false }

  # ───────── 老師隨筆 ─────────
  - name: posts
    label: 老師隨筆
    files:
      - name: posts
        label: 老師的文章
        file: content/posts.json
        format: json
        fields:
          - name: items
            label: 文章
            label_singular: 文章
            widget: list
            summary: "{{fields.date}}｜{{fields.title}}"
            fields:
              - { name: title, label: 標題, widget: string }
              - { name: date, label: 日期（可不填）, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false, hint: "沒填日期的文章會排在列表最後面" }
              - { name: cover, label: 封面照片, widget: image, required: false }
              - { name: summary, label: 摘要（列表上顯示的短文字）, widget: text, required: false }
              - { name: body, label: 內文, widget: markdown, required: false }

  # ───────── 相簿 ─────────
  - name: gallery
    label: 活動相簿
    files:
      - name: gallery
        label: 相片與影片
        file: content/gallery.json
        format: json
        fields:
          # 一個相簿只要取名字，再一次選很多張相片／影片就好；不用寫任何說明
          - name: albums
            label: 相簿
            label_singular: 相簿
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 相簿名稱（可不填）, widget: string, required: false, hint: "例：課程花絮、頌缽日常。不填就不分類" }
              - name: media
                label: 相片和影片（可以一次選很多個）
                widget: file
                multiple: true
                required: false
                accept: "image/*,video/mp4,video/webm,.mp4,.webm,.mov"
                media_libraries:
                  default:
                    config:
                      max_file_size: 15728640
                hint: "影片檔最大 15MB（約 20～30 秒的短片），一次儲存只放 1 支影片；超過或儲存失敗，請改放 YouTube（可設不公開），把網址貼在下面"
              - name: videos
                label: YouTube／臉書影片連結（可不填）
                widget: list
                required: false
                collapsed: true
                field: { name: url, label: 影片網址, widget: string }

  # ───────── 網站基本資料 ─────────
  - name: settings
    label: 網站基本資料
    files:
      - name: site
        label: 老師介紹與聯絡方式
        file: content/site.json
        format: json
        fields:
          - { name: siteName, label: 網站名稱（顯示在左上角與瀏覽器分頁）, widget: string }
          - { name: logo, label: Logo 圖案（可不放，不放就用目前的 logo）, widget: image, required: false, hint: "建議用正方形圖片，網站會裁成圓形；也會用在瀏覽器分頁的小圖示" }
          - { name: name, label: 老師姓名（顯示在「關於老師」）, widget: string }
          - { name: heroEyebrow, label: 首頁小標, widget: string, required: false }
          - { name: heroTitle, label: 首頁大標（可換行）, widget: text, required: false }
          - { name: heroSubtitle, label: 首頁副標, widget: string, required: false }
          - { name: heroImage, label: 首頁背景照片（可不放）, widget: image, required: false }
          - { name: teacherPhoto, label: 老師照片, widget: image, required: false }
          - { name: about, label: 關於老師, widget: markdown }
          - name: credentials
            label: 身分標籤
            widget: list
            field: { name: tag, label: 標籤, widget: string }
          - { name: bowlIntro, label: 頌缽介紹, widget: markdown }
          - name: bowlBenefits
